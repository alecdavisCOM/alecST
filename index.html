<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Redirect after 10 seconds to destination URL -->
  <meta http-equiv="refresh" content="4;url=https://alecdavis.com">
  <title>ALEC.ST</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Mobile-optimized full-screen centered canvas */
    #sequence-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="sequence-canvas"></canvas>

  <script>
    const CONFIG = {
      totalFrames: 192,         // frame_000000.webp to frame_000191.webp
      paddingDigits: 6,         // 6-digit zero padding (e.g. 000000)
      fps: 60,                  // Target 30 FPS
      dir: './img/',            // Directory containing webp images
      prefix: 'frame_',         // File prefix
      ext: '.webp'              // File extension
    };

    const canvas = document.getElementById('sequence-canvas');
    const ctx = canvas.getContext('2d');
    const images = [];
    let currentFrame = 0;
    let lastFrameTime = 0;
    const frameInterval = 1000 / CONFIG.fps;

    // Pad number with leading zeros (e.g., 5 -> "000005")
    function padZero(num, size) {
      let s = num + "";
      while (s.length < size) s = "0" + s;
      return s;
    }

    // Resize canvas resolution to match natural image aspect ratio or window display
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Draw current frame to canvas using "cover" positioning logic
    function drawFrame(img) {
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      // Calculate object-fit: cover dimensions
      const scale = Math.max(cw / iw, ch / ih);
      const nw = iw * scale;
      const nh = ih * scale;
      const cx = (cw - nw) / 2;
      const cy = (ch - nh) / 2;

      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, cx, cy, nw, nh);
    }

    // Animation loop locked to target 30 FPS
    function animate(currentTime) {
      requestAnimationFrame(animate);

      if (!lastFrameTime) lastFrameTime = currentTime;
      const elapsed = currentTime - lastFrameTime;

      if (elapsed >= frameInterval) {
        lastFrameTime = currentTime - (elapsed % frameInterval);

        const img = images[currentFrame];
        if (img && img.complete) {
          drawFrame(img);
        }

        currentFrame = (currentFrame + 1) % CONFIG.totalFrames;
      }
    }

    // Preload WebP sequence
    function preloadImages() {
      for (let i = 0; i < CONFIG.totalFrames; i++) {
        const img = new Image();
        const frameNum = padZero(i, CONFIG.paddingDigits);
        img.src = `${CONFIG.dir}${CONFIG.prefix}${frameNum}${CONFIG.ext}`;
        images.push(img);
      }
    }

    // Start loading and animation loop
    preloadImages();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
